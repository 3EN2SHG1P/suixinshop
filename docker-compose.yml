# 一键起 MySQL 8，供本机开发/新手跑通本项目（无需手工安装 MySQL）。
#
# 用法：在项目根目录执行   docker compose up -d
# 停止：docker compose down        清空数据重来：docker compose down -v
#
# ⚠️ 安全须知（请务必读完）
#   1. 本文件定位是「本机开发」，默认只把 3306 映射到 127.0.0.1，局域网/公网机器无法连接。
#      确需其它机器连接时，按下方 ports 的注释设置 DB_BIND_HOST（默认值即最安全值），
#      并同时换掉默认口令、配防火墙；不要把 3306 直接暴露到公网。
#   2. 默认密码 DEV_ONLY_123456 只是为了让新手零配置跑通第一次，
#      任何非本机环境都必须替换。替换方式二选一（任选其一即可）：
#        A. 命令行：PowerShell 下 $env:DB_PASSWORD='你的强密码'; docker compose up -d
#                    （bash / macOS / Linux 为 DB_PASSWORD=你的强密码 docker compose up -d）
#        B. 持久化写法：在本目录建 .env.db，再用
#           docker compose --env-file .env.db up -d
#      说明：Docker Compose 只自动加载项目根目录的 .env，不会自动读 .env.db，
#      所以必须显式加 --env-file，否则容器仍用默认密码 DEV_ONLY_123456。
#   3. .env.db 已被 .gitignore 忽略，不会进入仓库。
#   4. DB_BIND_HOST 同理：写在项目根 .env（Compose 自动读取，已被 gitignore）或命令行环境变量即可，
#      不要写进本文件，避免把「对局域网开放」变成仓库默认行为。
#
# 其余 DB_*（127.0.0.1 / 3306 / root / suixinshop）与 backend/.env.example 默认值一致，无需修改。

services:
  mysql:
    image: mysql:8.0
    # Apple Silicon（M1/M2/M3）如容器起不来，取消下面这行的注释
    # platform: linux/amd64
    container_name: suixinshop-mysql
    # 默认不随 Docker / 开机自动启动；需要时手动 docker compose up -d
    restart: "no"
    ports:
      # 默认只绑定回环地址（DB_BIND_HOST 未设置时），避免数据库被局域网或公网的其它机器访问。
      # 需要让其它机器连时：在项目根目录 .env（已被 gitignore，Compose 会自动读取）里写一行
      #   DB_BIND_HOST=<本机某块网卡的地址>
      # 常用取值：
      #   0.0.0.0           所有网卡，需自行配防火墙，风险最高
      #   192.168.x.x       本机 WLAN / 以太网地址，仅该网卡可达（Windows 下用 ipconfig 查）
      #   172.22.112.1      WSL / Hyper-V 虚拟网卡，供虚拟机内访问宿主
      # 注意：必须填「本机网卡」的地址。填成虚拟网段里别的机器的地址（如 172.22.x.x 上的其它 VM）
      # 会报 cannot assign requested address；填 127.0.0.1 则只有本机可用。
      # 放开后务必替换默认口令 DEV_ONLY_123456，并按 SECURITY.md 收敛访问范围。
      - "${DB_BIND_HOST:-127.0.0.1}:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-DEV_ONLY_123456}
      # MySQL 容器内所有 Alternate Root 主机允许连接——配合上面的回环映射，
      # 实际只有本机进程（含 Docker 网关地址）能连上
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: suixinshop
      TZ: Asia/Shanghai
    command:
      # 字符集与排序规则须与 seed 建库语句一致，否则会有 Illegal mix of collations
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      # MySQL 8 默认 caching_sha2_password，部分客户端握手失败，降级为兼容模式
      - --default-authentication-plugin=mysql_native_password
      - --default-time-zone=+08:00
    volumes:
      - suixinshop-mysql-data:/var/lib/mysql
    healthcheck:
      # 用 CMD-SHELL + $$VAR：密码由容器自身环境变量展开，compose 文件里不再出现明文，
      # 也不会出现在 docker inspect 的静态配置中。
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  suixinshop-mysql-data:
