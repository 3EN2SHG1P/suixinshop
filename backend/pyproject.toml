[project]
name = "shop-backend"
version = "0.1.0"
description = "随心商城 —— FastAPI + MySQL 异步电商后端"
license = "MIT"
authors = [{ name = "suixinshop contributors" }]
requires-python = ">=3.10"
dependencies = [
    "aiomysql>=0.3.2",
    "bcrypt>=5.0.0",
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "pyjwt>=2.13.0",
    "pymysql>=1.2.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52.4",
]

# 依赖源：uv.lock 逐包记录下载地址，当前全部指向清华 TUNA 镜像（锁文件为地址的事实来源）。
# 换源须整体重锁；仅编辑本文件或 uv.lock 文本无效——uv 按锁文件地址下载，改 URL 会被 hash 校验拒绝：
#   PowerShell: Remove-Item uv.lock; $env:UV_DEFAULT_INDEX='https://pypi.org/simple'; uv lock
#   bash:       rm uv.lock && UV_DEFAULT_INDEX=https://pypi.org/simple uv lock
# 重锁按下方版本下界重新解析，依赖可能上浮；重锁后先跑 pytest，失败可 git checkout -- uv.lock 回滚。

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# 固定测试目录：保证在 backend/ 下裸跑 pytest 也会加载 tests/conftest.py 的数据库探活钩子
testpaths = ["tests"]
